[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  node_bundler = "esbuild"

# Single-page app: unknown paths serve index.html.
# Function routes under /.netlify/functions/* are matched before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
